version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: trade-journal-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: trade_journal
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./server/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - trade-journal-network

  # Node.js Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trade-journal-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/trade_journal?authSource=admin
      PORT: 5000
      HOST: 0.0.0.0
      VERSION: v1
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      SECRET_KEY: your-super-secret-jwt-key-change-in-production
      ACCESS_KEY: your-access-key
      REFRESH_KEY: your-refresh-key
      NODEMAILER_EMAIL: your-email@gmail.com
      NODEMAILER_PASSWORD: your-app-password
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - trade-journal-network

  # React Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trade-journal-client
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://localhost:5000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - trade-journal-network

volumes:
  mongodb_data:

networks:
  trade-journal-network:
    driver: bridge
